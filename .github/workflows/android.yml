
name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  

permissions:
contents: read

concurrency:
group: ${{ github.workflow }}-${{ github.ref }}
cancel-in-progress: true

jobs:
build:
runs-on: ubuntu-latest
timeout-minutes: 60

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Validate question JSON
    run: python3 tools/validate_questions.py

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3
    with:
      tools: false

  - name: Verify Android SDK
    shell: bash
    run: |
      set -e
      echo "ANDROID_HOME=$ANDROID_HOME"
      echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
      test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || {
        echo "::error::Android SDK command-line tools not found."
        exit 1
      }
      echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

  - name: Install SDK, NDK and CMake
    shell: bash
    run: |
      set -e
      yes | sdkmanager --licenses >/dev/null || true
      sdkmanager \
        "platform-tools" \
        "platforms;android-34" \
        "build-tools;34.0.0" \
        "ndk;26.1.10909125" \
        "cmake;3.22.1"

  - name: Set up Gradle 8.9
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.9"

  - name: Verify project files
    shell: bash
    run: |
      set -e
      test -f settings.gradle || test -f settings.gradle.kts
      test -f app/build.gradle || test -f app/build.gradle.kts
      echo "Project files found."

  - name: Unit tests
    run: gradle --no-daemon --stacktrace testDebugUnitTest

  - name: Build debug APK
    run: gradle --no-daemon --stacktrace assembleDebug

  - name: Decode release keystore
    if: env.HAS_KEYSTORE == 'true'
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    shell: bash
    run: |
      set -e
      echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      test -s "$RUNNER_TEMP/release.jks"

  - name: Build release APK
    if: env.HAS_KEYSTORE == 'true'
    env:
      KEYSTORE_PATH: ${{ runner.temp }}/release.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    run: gradle --no-daemon --stacktrace assembleRelease

  - name: Note about release build
    if: env.HAS_KEYSTORE != 'true'
    run: |
      echo "::notice::Release APK skipped because KEYSTORE_BASE64 is not configured."

  - name: Upload debug APK
    uses: actions/upload-artifact@v4
    with:
      name: reiting-test-debug-apk
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 14

  - name: Upload release APK
    if: env.HAS_KEYSTORE == 'true'
    uses: actions/upload-artifact@v4
    with:
      name: reiting-test-release-apk
      path: app/build/outputs/apk/release/*.apk
      if-no-files-found: error
      retention-days: 14

  - name: Upload test reports
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: test-reports
      path: |
        app/build/reports/tests
        app/build/test-results
      if-no-files-found: ignore
      retention-days: 7

  - name: Explain failure
    if: failure()
    run: |
      echo "::error::Build failed. Check the first failed step in the workflow logs."
